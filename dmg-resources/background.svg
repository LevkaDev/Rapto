<svg width="660" height="400" viewBox="0 0 660 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background gradient matching landing page -->
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0a0c"/>
      <stop offset="50%" style="stop-color:#0d0d10"/>
      <stop offset="100%" style="stop-color:#0a0a0c"/>
    </linearGradient>
    
    <!-- Electric Lime accent (matching landing) -->
    <linearGradient id="accentGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#9ACC00"/>
      <stop offset="100%" style="stop-color:#BFFF00"/>
    </linearGradient>
    
    <!-- Glow filter -->
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    
    <!-- Soft glow for accent elements -->
    <filter id="accentGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="660" height="400" fill="url(#bgGradient)"/>
  
  <!-- Blueprint grid pattern (like landing page) -->
  <g opacity="0.04">
    <!-- Horizontal lines -->
    <line x1="0" y1="80" x2="660" y2="80" stroke="white" stroke-width="1"/>
    <line x1="0" y1="160" x2="660" y2="160" stroke="white" stroke-width="1"/>
    <line x1="0" y1="240" x2="660" y2="240" stroke="white" stroke-width="1"/>
    <line x1="0" y1="320" x2="660" y2="320" stroke="white" stroke-width="1"/>
    <!-- Vertical lines -->
    <line x1="132" y1="0" x2="132" y2="400" stroke="white" stroke-width="1"/>
    <line x1="264" y1="0" x2="264" y2="400" stroke="white" stroke-width="1"/>
    <line x1="396" y1="0" x2="396" y2="400" stroke="white" stroke-width="1"/>
    <line x1="528" y1="0" x2="528" y2="400" stroke="white" stroke-width="1"/>
  </g>
  
  <!-- Accent glow blobs -->
  <ellipse cx="100" cy="100" rx="150" ry="100" fill="#BFFF00" opacity="0.03"/>
  <ellipse cx="560" cy="320" rx="180" ry="120" fill="#BFFF00" opacity="0.025"/>
  
  <!-- Curved arrow from left to right -->
  <path d="M 245 200 
           C 280 200, 300 175, 330 175 
           C 360 175, 380 200, 415 200" 
        stroke="url(#accentGradient)" 
        stroke-width="3" 
        fill="none" 
        stroke-linecap="round"
        filter="url(#glow)"
        opacity="0.9"/>
  
  <!-- Arrowhead -->
  <polygon points="415,200 400,188 400,212" 
           fill="#BFFF00" 
           filter="url(#glow)"
           opacity="0.9"/>
  
  <!-- Icon placement guides (dotted circles) -->
  <!-- Left: App icon area -->
  <circle cx="165" cy="185" r="55" stroke="#BFFF00" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.25"/>
  
  <!-- Right: Applications folder area -->
  <circle cx="495" cy="185" r="55" stroke="#BFFF00" stroke-width="1.5" stroke-dasharray="5 5" fill="none" opacity="0.25"/>
  
  <!-- Text labels -->
  <text x="165" y="280" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="500" opacity="0.6">
    Rapto
  </text>
  <text x="495" y="280" text-anchor="middle" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="14" font-weight="500" opacity="0.6">
    Applications
  </text>
  
  <!-- Install instruction with glow -->
  <text x="330" y="345" text-anchor="middle" fill="#BFFF00" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif" font-size="15" font-weight="600" opacity="0.85" filter="url(#glow)">
    Drag to install
  </text>
  
  <!-- Decorative mini windows (matching app icon style) -->
  <!-- Top right corner -->
  <g opacity="0.12" transform="translate(575, 25)">
    <rect x="0" y="0" width="22" height="18" rx="3" fill="white"/>
    <rect x="0" y="22" width="22" height="28" rx="3" fill="white"/>
    <rect x="26" y="0" width="28" height="50" rx="3" fill="white"/>
  </g>
  
  <!-- Bottom left corner -->
  <g opacity="0.08" transform="translate(20, 325)">
    <rect x="0" y="0" width="18" height="14" rx="2" fill="white"/>
    <rect x="0" y="18" width="18" height="22" rx="2" fill="white"/>
    <rect x="22" y="0" width="22" height="40" rx="2" fill="white"/>
  </g>
  
  <!-- Corner brackets (like landing page) -->
  <g stroke="#BFFF00" stroke-width="2" fill="none" opacity="0.2">
    <!-- Top left -->
    <path d="M 20 35 L 20 20 L 35 20"/>
    <!-- Top right -->
    <path d="M 625 20 L 640 20 L 640 35"/>
    <!-- Bottom left -->
    <path d="M 20 365 L 20 380 L 35 380"/>
    <!-- Bottom right -->
    <path d="M 625 380 L 640 380 L 640 365"/>
  </g>
</svg>
