name: Repository hygiene

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read
  # gitleaks lists the commits of a pull request
  pull-requests: read

jobs:
  check:
    # Nothing here needs macOS, and Linux runners start without the macOS queue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check tracked files
        run: scripts/check-repo.sh
      - name: Check commit messages
        if: github.event_name == 'pull_request'
        run: |
          for c in $(git rev-list ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}); do
            git log -1 --format=%B "$c" > msg.txt
            scripts/check-repo.sh --message msg.txt || exit 1
          done
      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
