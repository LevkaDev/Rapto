name: Feature request
description: Suggest something Rapto could do
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: Your idea
      description: How you imagine it working. Rapto aims to stay small and predictable, so not every idea will be accepted.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead for now
